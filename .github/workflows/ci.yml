name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Typecheck / Tests / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Pack check
        run: npm pack --dry-run --ignore-scripts

  real-wsl:
    name: Real-WSL security probe (informational)
    runs-on: windows-latest
    # WSL availability on GitHub Windows runners is not guaranteed; this job
    # reports the real security probe result when a distro is present and
    # never blocks the merge gate on runner environment flakiness.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Enable WSL (best effort)
        shell: pwsh
        run: |
          wsl --status 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WSL not installed; probe will be skipped."
          }

      - name: Real security probe (PTY geometry + interop escape)
        shell: pwsh
        run: node smoke/security-probe.mjs

      - name: Official-tool protocol integration smoke
        shell: pwsh
        run: node smoke/integration.mjs
